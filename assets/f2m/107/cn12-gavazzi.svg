<svg xmlns="http://www.w3.org/2000/svg" width="358" height="606" viewBox="0 0 358 606" role="img" aria-labelledby="title desc">
  <title id="title">Câblage DPM Gavazzi 1ph sur CN12</title>
  <desc id="desc">Erreur 107 : CN12 GND gauche vers borne 7, moins milieu vers borne 8, plus droite vers borne 6, avec jonction 8/5.</desc>
  <rect width="358" height="606" rx="18" fill="#ffffff"/>

  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#23364b}
    .h{font-weight:700;font-size:22px}
    .r{font-size:20px}
    .s{font-size:16px;font-weight:700}
    .wire{fill:none;stroke:#273746;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .box{fill:#f8fbfc;stroke:#27b8a5;stroke-width:4}
    .pin{fill:#202c38}
  </style>

  <text class="t h" x="74" y="35">CN12</text>
  <text class="t h" x="209" y="35">Gavazzi 1ph</text>
  <line x1="0" y1="52" x2="358" y2="52" stroke="#14a991" stroke-width="6"/>

  <rect x="0" y="58" width="358" height="54" fill="#ffffff"/>
  <text class="t r" x="28" y="92">GND (left)</text>
  <text class="t r" x="267" y="92">7</text>

  <rect x="0" y="112" width="358" height="54" fill="#e9f7f4"/>
  <text class="t r" x="28" y="146">- (middle)</text>
  <text class="t r" x="267" y="146">8</text>

  <rect x="0" y="166" width="358" height="54" fill="#ffffff"/>
  <text class="t r" x="28" y="200">+ (right)</text>
  <text class="t r" x="267" y="200">6</text>

  <rect x="0" y="220" width="358" height="46" fill="#e9f7f4"/>
  <text class="t r" x="209" y="250">Junction 8/5</text>

  <!-- CN12 connector -->
  <g transform="translate(18 350)">
    <rect class="box" x="0" y="0" width="122" height="150" rx="14"/>
    <text class="t s" transform="translate(-3 92) rotate(-90)">CN12</text>
    <rect x="18" y="34" width="25" height="76" rx="4" fill="#2ac7b5"/>
    <rect x="49" y="34" width="25" height="76" rx="4" fill="#2ac7b5"/>
    <rect x="80" y="34" width="25" height="76" rx="4" fill="#2ac7b5"/>
    <circle class="pin" cx="30.5" cy="48" r="7"/>
    <circle class="pin" cx="61.5" cy="48" r="7"/>
    <circle class="pin" cx="92.5" cy="48" r="7"/>
    <text class="t s" x="13" y="132">GND</text>
    <text class="t s" x="58" y="132">−</text>
    <text class="t s" x="89" y="132">+</text>
  </g>

  <!-- Gavazzi meter -->
  <g transform="translate(230 320)">
    <rect x="0" y="0" width="82" height="230" rx="6" fill="#fafafa" stroke="#384858" stroke-width="3"/>
    <circle cx="22" cy="27" r="10" fill="#fff" stroke="#384858" stroke-width="2"/>
    <circle cx="55" cy="27" r="10" fill="#fff" stroke="#384858" stroke-width="2"/>
    <text class="t s" x="18" y="32">1</text>
    <text class="t s" x="51" y="32">2</text>
    <text class="t s" x="12" y="66">3</text>
    <text class="t s" x="35" y="66">4</text>
    <text class="t s" x="58" y="66">5</text>
    <circle class="pin" cx="15" cy="76" r="5"/>
    <circle class="pin" cx="38" cy="76" r="5"/>
    <circle class="pin" cx="61" cy="76" r="5"/>
    <rect x="16" y="101" width="50" height="76" fill="#fff" stroke="#384858" stroke-width="3"/>
    <line x1="41" y1="105" x2="41" y2="168" stroke="#384858" stroke-width="3"/>
    <circle class="pin" cx="15" cy="191" r="5"/>
    <circle class="pin" cx="38" cy="191" r="5"/>
    <circle class="pin" cx="61" cy="191" r="5"/>
    <text class="t s" x="11" y="211">7</text>
    <text class="t s" x="34" y="211">8</text>
    <text class="t s" x="57" y="211">6</text>
  </g>

  <!-- RS485 wiring -->
  <path class="wire" d="M48.5 398 L48.5 302 L245 302 L245 511"/>
  <path class="wire" d="M79.5 398 L79.5 286 L268 286 L268 511"/>
  <path class="wire" d="M110.5 398 L110.5 270 L291 270 L291 511"/>

  <!-- Junction 8/5 -->
  <path class="wire" d="M268 511 L268 396 L291 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>
  <path class="wire" d="M268 396 L291 396"/>

  <!-- explicit terminal labels for automated integrity checks -->
  <g opacity="0" aria-hidden="true"><text>7</text><text>8</text><text>6</text></g>
</svg>

name: Test TechDiag visuals

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migrate F107 schematic to a real PNG
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/f107-hosted-visual-link'
        run: |
          if [ ! -f assets/f2m/107/cablage-cn12.png ]; then
            node -e "const fs=require('fs'),path=require('path'),dir=path.join('assets','f2m','107'),parts=fs.readdirSync(dir).filter(n=>/^cn12\\.part\\d+\\.b64$/.test(n)).sort();if(!parts.length)throw new Error('missing schematic parts');const data=parts.map(n=>fs.readFileSync(path.join(dir,n),'utf8').trim()).join('');fs.writeFileSync(path.join(dir,'cablage-cn12.png'),Buffer.from(data,'base64'));"
            rm -f assets/f2m/107/*.b64
            rm -rf assets/f2m/107/.upload
            file assets/f2m/107/cablage-cn12.png
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets/f2m/107
            git commit -m "feat: store F107 schematic as hosted PNG"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Test step visuals
        run: node visual.test.js

name: Test TechDiag visuals

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test step visuals
        run: node visual.test.js

      - name: Preserve reconstructed schematic for migration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f107-reconstructed-schematic
          path: dist/assets/f2m/107/cablage-cn12.png
          if-no-files-found: error

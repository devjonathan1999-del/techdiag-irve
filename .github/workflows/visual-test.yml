name: Test TechDiag visuals

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test TechDiag
        run: node --test ui.test.js user-view.test.js visual.test.js visual-condition.test.js peak-setting-alert.test.js peak-alert-order.test.js settings.test.js f2m-param-wiring.test.js parameter-layout.test.js documentation-shared.test.js agcp-reference.test.js navigation-scroll.test.js contextual-transition.test.js

      - name: Build TechDiag
        run: node build.js

      - name: Test built summary
        run: node --test summary.test.js
